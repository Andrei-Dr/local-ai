# Guide sections, in this order (research/patches/README.md).
[themes.cache]
heading = "1. A GPU cache for the experts"
intro = """The core idea. The GPU keeps a least-recently-used cache of expert weights ("slots", ~20-26 per layer). An expert in the
cache is computed on the GPU; a miss is computed on the CPU from system RAM while its upload happens in the background, so a miss
never waits for the bus. About half of all expert uses hit the cache."""

[themes.overlap]
heading = "2. Keep the CPU and the GPU busy at the same time"
intro = """Each token alternates between CPU work (expert misses) and GPU work 40 times. These patches remove waits so the two
overlap; 0008-0010 together gave part of a +5.4% decode gain with byte-identical output."""

[themes.prefill]
heading = "3. Fast prompt reading: prefill mode"
intro = """Reading a prompt processes thousands of tokens at once, where the per-token cache no longer helps. With 0014, prefill
mode took a 9,279-token prompt from 47 to 404 tokens/s; the upload overlap (0024) adds +19-23% with identical results."""

[themes.turing]
heading = "4. GPU code for a card without tensor cores"
intro = """GTX 16xx cards report the same generation as RTX 20xx cards but lack their tensor cores, so upstream picks kernels that
are slow here. Writing after a 9k-token prompt got +6-7% from 0021 alone."""

[themes.draft]
heading = "5. Cheaper speculative decoding"
intro = """The model has a small built-in draft head (MTP) that guesses the next tokens; the full model checks the guesses in one
pass. Cutting the draft's vocabulary made writing 5-10% faster with the output unchanged."""
